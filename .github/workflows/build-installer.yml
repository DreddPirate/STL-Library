# Builds STL-Library-Setup.exe on a Windows machine in the cloud.
# Save this file in your repo as:  .github/workflows/build-installer.yml
name: Build Windows installer

on:
  workflow_dispatch:        # lets you press "Run workflow" in the Actions tab
  push:
    tags: ["v*"]            # also builds and publishes a release when you push a tag like v1.0

permissions:
  contents: write           # needed only to attach the installer to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow numpy

      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean --onedir --windowed --name "STL Library" --icon app.ico stl_library.pyw

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the install wizard (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" STL_Library.iss'

      - name: Save the installer as a download
        uses: actions/upload-artifact@v4
        with:
          name: STL-Library-Setup
          path: installer/STL-Library-Setup.exe

      - name: Attach installer to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/STL-Library-Setup.exe
